name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test and check the bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install with install scripts off
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests pass with no failures and no skips
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.txt"
          grep -q '^ℹ fail 0$' "$RUNNER_TEMP/test.txt"
          grep -q '^ℹ skipped 0$' "$RUNNER_TEMP/test.txt"
      - name: Rebuild the bundle
        run: npm run build
      - name: dist/ matches the committed bundle
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- dist)"
          if [ -n "$changed" ]; then
            echo "::error::dist/ differs from the committed bundle. Run npm run build and commit dist/."
            echo "$changed"
            git diff --stat -- dist
            exit 1
          fi
          sha256sum dist/index.mjs
